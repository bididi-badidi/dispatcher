name: Branch Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-source-branch:
    name: require dev source for main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.base.ref == 'main'
    steps:
      - name: Require dev to main promotion
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::Pull requests targeting main must come from dev."
            exit 1
          fi
          echo "Pull request source branch is dev."
