name: Sync agent docs

on:
  push:
    paths:
      - CLAUDE.md
      - GEMINI.md
      - scripts/sync_agent_docs.sh
      - .github/workflows/sync-agent-docs.yml
  pull_request:
    paths:
      - CLAUDE.md
      - GEMINI.md
      - scripts/sync_agent_docs.sh
      - .github/workflows/sync-agent-docs.yml

jobs:
  sync-agent-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check CLAUDE.md and GEMINI.md parity
        run: scripts/sync_agent_docs.sh
