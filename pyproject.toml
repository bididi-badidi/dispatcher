[project]
name = "dispatcher"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35",
    "langgraph>=1.0.4",
    "redis[hiredis]>=5.0",
]

[project.scripts]
dispatcher-repos = "dispatcher.repos_cli:main"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "pre-commit>=4.0.0",
    "pytest>=9.0.3",
    "ruff>=0.8.0",
]
